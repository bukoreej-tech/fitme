const idb=new Promise(r=>{try{const q=indexedDB.open('fitme-photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
let mem=[],photos=[];
async function pAll(){const d=await idb;let a=[];if(d)a=await new Promise(r=>{try{const q=d.transaction('p').objectStore('p').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}});return a.concat(mem).sort((x,y)=>x.id-y.id)}
async function pPut(o){const d=await idb;if(d){const ok=await new Promise(r=>{try{const t=d.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=()=>r(1);t.onerror=()=>r(0);t.onabort=()=>r(0)}catch(e){r(0)}});if(ok)return 1}mem.push(o);return 0}
async function pDel(id){mem=mem.filter(x=>x.id!=id);const d=await idb;if(!d)return;return new Promise(r=>{try{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=r;t.onerror=r}catch(e){r()}})}

function build(p){const have=e=>e[4].every(x=>p.eq.includes(x)),pool=g=>EX.filter(e=>e[3]==g&&have(e));

const p={...F,times:F.times.slice(0,F.n)};if(editing){S.p=p;S.plan=build(p)}else S={p,plan:build(p),log:{},w:[{d:key(),kg:p.w,note:'เริ่มต้น'}]};editing=false;V='today';save();render()}

<div class="card"><div class="wk">${[...Array(7)].map((_,i)=>{const d=new Date(now);d.setDate(now.getDate()-now.getDay()+i);const c=(d.getDay()==now.getDay()?'t ':'')+(logOf(key(d)).length?'s ':S.plan[d.getDay()]?'p ':'');return`<div class="wd ${c}">${DN[i]}<span>${logOf(key(d)).length?'✓':S.plan[i]?'•':''}</span></div>`}).join('')}</div></div>`;

`<select onchange="add(${d},this.value)" style="margin-top:8px"><option value="">＋ เพิ่มท่า…</option>${EX.map(e=>`<option value="${e[0]}">${e[2]} ${e[1]}</option>`).join('')}</select></div>`});return h}

<h2>อุปกรณ์ที่มีตอนนี้</h2><div class="chips">${EQ.map(([v,t])=>`<span class="chip ${LB.eq.includes(v)?'on':''}" onclick="tgEq('${v}')">${t}</span>`).join('')}</div><small style="margin-top:6px">ไม่เลือกอะไร = ใช้น้ำหนักตัว</small><h2>✅ เล่นได้เลย (${ok.length} ท่า)</h2>`;
h+=ok.map(e=>lcard(e)).join('')||'<div class="card"><small>ยังไม่มีท่า ลองเพิ่มอุปกรณ์</small></div>';if(no.length)h+=`<h2>🔒 ต้องมีอุปกรณ์เพิ่ม</h2>`+no.map(e=>lcard(e,1)).join('');return h}
function info(id){const e=E(id),st=e[6].split('|'),tip=st.pop(),o=document.createElement('div');o.className='modal';o.onclick=ev=>{if(ev.target==o)o.remove()};
o.innerHTML=`<div class="sheet"><div style="font-size:56px;text-align:center">${e[2]}</div><h1 style="text-align:center">${e[1]}</h1><div class="chips" style="justify-content:center"><span class="chip on">${MN[e[5]]}</span><span class="chip">${eqTxt(e)}</span></div><h2>วิธีทำ</h2><ol>${st.map(x=>`<li>${x}</li>`).join('')}</ol><div class="note">💡 ${tip}</div>
<select id="addto" style="margin-top:12px"><option value="">＋ เพิ่มท่านี้เข้า…</option><option value="x">วันนี้ (ครั้งเดียว)</option>${Object.keys(S.plan).sort().map(d=>`<option value="${d}">ตารางประจำวัน${DF[d]}</option>`).join('')}</select><button class="btn g" style="margin-top:10px" onclick="this.closest('.modal').remove()">ปิด</button></div>`;
o.querySelector('#addto').onchange=function(){addTo(id,this.value);o.remove()};document.body.appendChild(o)}
function addTo(id,v){if(!v)return;const e=E(id),tx=id=='jg'?'15 นาที':id=='pb'?'3×40 วิ':e[3]=='K'?'3×30 วิ':e[3]=='C'?'3×20 ครั้ง':'3×12 ครั้ง';

try{navigator.serviceWorker&&navigator.serviceWorker.register('sw.js');navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
